<!--
  The LogoMark glyph from src/shared/layout/icons.tsx, so the browser tab and the
  top bar carry the same mark.

  Geometry is identical to the component. Two deliberate differences:

  1. Literal colours instead of the theme custom properties. A favicon renders
     outside the document, so those never resolve; left as variables the strokes
     fall back to none and the book loses its pages. Values are the rust and card
     tokens from src/shared/theme/tokens.css.
  2. The solid variant, not the header's light one. Light inverts to a white fill
     because it sits on the rust top bar; standing alone on a browser tab that
     would just be a white box.

  Note for editors: no double hyphens anywhere in this comment. XML forbids them
  inside comments, and a favicon that fails to parse simply does not render.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect x="3" y="4" width="26" height="24" rx="2.5" fill="#9c5b34" />
  <path d="M16 6.5v19" stroke="#ffffff" stroke-width="1.6" />
  <path
    d="M7.5 10.5h5M7.5 14h5M19.5 10.5h5M19.5 14h5"
    stroke="#ffffff"
    stroke-width="1.4"
    stroke-linecap="round"
    opacity="0.8"
  />
</svg>
